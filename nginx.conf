user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;


events {
	worker_connections 1024;
}


http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	'$status $body_bytes_sent "$http_referer" '
	'"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	reset_timedout_connection on;

	keepalive_timeout 75s;

	gzip off;
	server_tokens off;

	server_names_hash_bucket_size 64;
	types_hash_max_size 2048;
	types_hash_bucket_size 64;
	client_body_buffer_size 64k;
	client_max_body_size 100m;

	proxy_http_version 1.1;
	proxy_redirect off;
	proxy_buffer_size          128k;
	proxy_buffers              4 256k;
	proxy_busy_buffers_size    256k;

	# Docker default address pools
	# https://github.com/moby/libnetwork/blob/3797618f9a38372e8107d8c06f6ae199e1133ae8/ipamutils/utils.go#L10-L22
	set_real_ip_from 172.17.0.0/16;
	set_real_ip_from 172.18.0.0/16;
	set_real_ip_from 172.19.0.0/16;
	set_real_ip_from 172.20.0.0/14;
	set_real_ip_from 172.24.0.0/14;
	set_real_ip_from 172.28.0.0/14;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 10.0.0.0/8;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	# Remove the Connection header if the client sends it,
	# it could be "close" to close a keepalive connection
	proxy_set_header Connection '';
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Request-Id $request_id;
	proxy_read_timeout 90s;
	proxy_send_timeout 5s;

	# Railway gives each service a new private IP on every redeploy, and nginx
	# resolves upstream hostnames only once at startup. A static upstream/proxy_pass
	# therefore keeps routing to a stale IP after relay/web restart (requests hang,
	# nginx logs 499). Using Railway's internal DNS resolver + a *variable* in
	# proxy_pass forces nginx to re-resolve at request time, so nginx survives
	# upstream restarts without a redeploy. fd12::10 is Railway's internal resolver
	# (nameserver in the container's /etc/resolv.conf).
	resolver [fd12::10] valid=10s;

	server {
		listen 80;

		location /api/store/ {
			set $relay_upstream sentry-relay.railway.internal:3000;
			proxy_pass http://$relay_upstream;
		}
		location ~ ^/api/[1-9]\d*/ {
			set $relay_upstream sentry-relay.railway.internal:3000;
			proxy_pass http://$relay_upstream;
		}
		location ^~ /api/0/relays/ {
			set $relay_upstream sentry-relay.railway.internal:3000;
			proxy_pass http://$relay_upstream;
		}
		location ^~ /js-sdk/ {
			root /var/www/;
			# This value is set to mimic the behavior of the upstream Sentry CDN. For security reasons,
			# it is recommended to change this to your Sentry URL (in most cases same as system.url-prefix).
			add_header Access-Control-Allow-Origin *;
		}
		location / {
			set $sentry_upstream sentry-web.railway.internal:9000;
			proxy_pass http://$sentry_upstream;
		}
		location /_assets/ {
			set $sentry_upstream sentry-web.railway.internal:9000;
			rewrite ^/_assets/(.*)$ /_static/dist/sentry/$1 break;
			proxy_pass http://$sentry_upstream;
			proxy_hide_header Content-Disposition;
		}
		location /_static/ {
			set $sentry_upstream sentry-web.railway.internal:9000;
			proxy_pass http://$sentry_upstream;
			proxy_hide_header Content-Disposition;
		}
	}
}
